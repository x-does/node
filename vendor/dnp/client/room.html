<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Room · DefinitelyNotPong</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body data-page="room">
    <main class="room-layout">
      <header class="room-header card">
        <div>
          <a class="back-link" href="./index.html" id="return-home">← Home</a>
          <h1>DefinitelyNotPong</h1>
          <p class="status-line"><span id="connection-dot" class="dot"></span><span id="connection-status">Connecting…</span></p>
        </div>
        <div class="room-code-box">
          <span>Room</span>
          <strong id="room-code-display">------</strong>
          <button id="copy-link" type="button">Copy invite</button>
          <p id="copy-message" class="mini-message" aria-live="polite"></p>
        </div>
      </header>

      <section class="game-card card">
        <div class="scorebar">
          <div><span class="team-dot left"></span>Left <strong id="left-score">0</strong></div>
          <div id="game-status">Lobby</div>
          <div>Right <strong id="right-score">0</strong><span class="team-dot right"></span></div>
        </div>
        <div class="canvas-wrap">
          <canvas id="game-canvas" width="900" height="540" aria-label="DefinitelyNotPong game canvas"></canvas>
        </div>
        <div class="touch-controls" aria-label="Touch controls">
          <button data-touch="-1" type="button">◀ / ▲</button>
          <button data-touch="0" type="button">Stop</button>
          <button data-touch="1" type="button">▶ / ▼</button>
        </div>
        <p class="hint">Side paddles: W/S or ↑/↓. Top/bottom paddles: A/D or ←/→.</p>
      </section>

      <aside class="side-panel card">
        <section>
          <h2>Lobby</h2>
          <ul id="player-list" class="player-list"></ul>
        </section>

        <section id="admin-panel" class="admin-panel" hidden>
          <h2>Admin</h2>
          <button id="start-game" class="primary" type="button" disabled>Start game</button>
          <p id="admin-help" class="muted small">Need at least 2 human players for multiplayer.</p>
        </section>

        <section>
          <h2>Share</h2>
          <input id="share-link" class="share-input" readonly />
          <p id="room-message" class="message" role="status" aria-live="polite"></p>
        </section>
      </aside>
    </main>

    <script src="./config.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
