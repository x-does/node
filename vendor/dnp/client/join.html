<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Join Room · DefinitelyNotPong</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body data-page="join">
    <main class="shell narrow-shell">
      <section class="card panel">
        <a class="back-link" href="./index.html">← Home</a>
        <p class="eyebrow">Join room</p>
        <h1 id="join-code-heading">Room ------</h1>
        <p class="muted">Enter a display name and we’ll connect you automatically.</p>

        <form id="join-form" novalidate>
          <label class="field">
            <span>Display name</span>
            <input id="join-name" maxlength="16" autocomplete="nickname" placeholder="Your name" required />
          </label>
          <button class="primary" type="submit">Join Room</button>
          <p id="join-message" class="message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="./config.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
